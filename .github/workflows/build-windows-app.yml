# Reusable Windows desktop build for .NET apps.
#
# Call this from any repo owned by apettey (eve-contracts, hangarscope, multi-box):
#
#   jobs:
#     build:
#       uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
#       with:
#         project: src/MyApp/MyApp.csproj
#         app-name: MyApp
#
# Produces a ready-to-run, self-contained win-x64 zip:
#  - every run: uploaded as a workflow artifact
#  - runs for a v* tag: attached to a GitHub Release for that tag
#  - runs with a `version` input (e.g. from a push to the main branch): built and
#    packed as that version, and only after the build succeeds is the v<version> tag
#    created on the built commit and the GitHub Release published. Callers that
#    don't pass `version` keep the tag-driven behaviour above.
name: Build Windows App

on:
  workflow_call:
    inputs:
      project:
        description: Path to the .csproj to publish
        required: true
        type: string
      app-name:
        description: Application name used for the zip / release asset
        required: true
        type: string
      dotnet-version:
        description: .NET SDK version
        required: false
        type: string
        default: 10.0.x
      runtime:
        description: Publish runtime identifier
        required: false
        type: string
        default: win-x64
      self-contained:
        description: Bundle the runtime so no .NET install is needed
        required: false
        type: boolean
        default: true
      test-project:
        description: Optional test project to run before publishing (empty = skip)
        required: false
        type: string
        default: ""
      publish-args:
        description: Extra arguments appended to dotnet publish
        required: false
        type: string
        default: ""
      main-exe:
        description: >-
          Main executable name (e.g. MyApp.exe). When set, a Velopack installer
          (Setup.exe + delta update packages) is built and, on tag builds,
          published to the GitHub Release so installed apps auto-update.
        required: false
        type: string
        default: ""
      pack-id:
        description: Velopack package id (defaults to app-name)
        required: false
        type: string
        default: ""
      version:
        description: >-
          Release version (x.y.z, no leading v). When set, the run is a release:
          it builds this version from the current commit and, only after the build,
          tests and pack succeed, creates and pushes tag v<version> and publishes the
          GitHub Release. Empty (default) = version comes from a v* tag ref, if any.
        required: false
        type: string
        default: ""
      release-notes:
        description: >-
          Markdown body for the GitHub Release (only with `version`).
          Empty = GitHub's generated notes.
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # release upload on tag builds
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Compute version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $tagExists = 'false'
          if ($env:INPUT_VERSION) {
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "version input must be x.y.z (got '$env:INPUT_VERSION')." }
            $version = $env:INPUT_VERSION
            $tag = "v$version"
            $release = 'true'
            # A complete release is never overwritten: fail before building if the tag is taken,
            # unless it is this commit's tag from an earlier run that failed before the release was
            # complete (no release, a draft, or no zip yet - the zip is attached last). Then finish it.
            # The peeled "^{}" line (annotated tags) sorts after the tag line and holds the commit.
            $remote = @(git ls-remote --tags origin | Where-Object { $_ -match "\trefs/tags/$([regex]::Escape($tag))(\^\{\})?$" })
            if ($remote) {
              $tagSha = ($remote[-1] -split '\s+')[0]
              if ($tagSha -ne '${{ github.sha }}') { throw "Tag $tag already exists on origin at $tagSha." }
              $zip = "${{ inputs.app-name }}-$version-${{ inputs.runtime }}.zip"
              $existing = gh release view $tag --repo '${{ github.repository }}' --json isDraft,assets 2>$null | ConvertFrom-Json
              if ($LASTEXITCODE -eq 0 -and -not $existing.isDraft -and ($existing.assets.name -contains $zip)) {
                throw "Release $tag already exists and is complete."
              }
              Write-Host "Tag $tag is on this commit but its release isn't complete - finishing it."
              $tagExists = 'true'
            }
            $global:LASTEXITCODE = 0
          } elseif ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(?<v>\d+\.\d+\.\d+.*)$') {
            $version = $Matches.v
            $release = 'true'
          } else {
            # Velopack requires package versions >= 0.0.1
            $version = "0.0.1-ci.${{ github.run_number }}"
            $release = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag-exists=$tagExists" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (release: $release, tag: $tag)"

      - name: Test
        if: inputs.test-project != ''
        run: dotnet test "${{ inputs.test-project }}" -c Release --nologo

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish "${{ inputs.project }}" `
            -c Release `
            -r ${{ inputs.runtime }} `
            --self-contained ${{ inputs.self-contained }} `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish `
            ${{ inputs.publish-args }}

      - name: Zip
        shell: pwsh
        run: |
          $zip = "${{ inputs.app-name }}-${{ steps.version.outputs.version }}-${{ inputs.runtime }}.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # A storage-quota blip must never fail the build or block a release publish;
        # the zip is a convenience download, not a release gate.
        continue-on-error: true
        with:
          name: ${{ inputs.app-name }}-${{ steps.version.outputs.version }}-${{ inputs.runtime }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      # ---- Velopack installer + auto-update packages ----
      - name: Velopack pack
        if: inputs.main-exe != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk
          $packId = '${{ inputs.pack-id }}'
          if (-not $packId) { $packId = '${{ inputs.app-name }}' }
          # Previous releases enable delta packages; fails harmlessly before the first release.
          # Tag builds only: CI builds are versioned 0.0.1-ci.N, which sorts below any
          # published release, and vpk pack refuses to package a version lower than one
          # already in the Releases folder. Deltas only matter for what the updater serves.
          if ('${{ steps.version.outputs.release }}' -eq 'true') {
            vpk download github --repoUrl 'https://github.com/${{ github.repository }}' --token $env:GH_TOKEN
            if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release found - building full package only.' }
          }
          vpk pack --packId $packId `
            --packVersion '${{ steps.version.outputs.version }}' `
            --packDir publish `
            --mainExe '${{ inputs.main-exe }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Only real releases keep an installer artifact; CI builds skip it to stay
      # well under the Actions storage quota (the installer is ~3x the app zip).
      - name: Upload installer artifact
        if: inputs.main-exe != '' && steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ inputs.app-name }}-${{ steps.version.outputs.version }}-installer
          path: Releases/
          retention-days: 7

      # Version-input releases: the tag is created only now, after test, publish and
      # pack succeeded, on the commit that was built. (Tag pushes made with the job's
      # GITHUB_TOKEN don't trigger other workflow runs, so this doesn't rebuild.) If a
      # later step fails, re-running with the same version on the same commit reuses it.
      - name: Create tag (version releases)
        if: inputs.version != '' && steps.version.outputs.tag-exists != 'true'
        shell: pwsh
        run: |
          git tag '${{ steps.version.outputs.tag }}' '${{ github.sha }}'
          git push origin 'refs/tags/${{ steps.version.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish Velopack packages to release (tag builds)
        if: inputs.main-exe != '' && steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Finishing a release an earlier run started: add to it instead of failing on it.
          $merge = @()
          if ('${{ steps.version.outputs.tag-exists }}' -eq 'true') { $merge = @('--merge') }
          vpk upload github --repoUrl 'https://github.com/${{ github.repository }}' `
            --token $env:GH_TOKEN `
            --publish @merge `
            --releaseName '${{ inputs.app-name }} ${{ steps.version.outputs.tag }}' `
            --tag '${{ steps.version.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Release (tag builds)
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          # Passed via env, never interpolated into the script: notes are free text.
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          $notesArgs = @('--generate-notes')
          if ($env:RELEASE_NOTES) {
            $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            [IO.File]::WriteAllText($notesFile, $env:RELEASE_NOTES)
            $notesArgs = @('--notes-file', $notesFile)
          }
          gh release view $env:TAG --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP_NAME --clobber --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if ($env:RELEASE_NOTES) {
              gh release edit $env:TAG --notes-file $notesFile --repo '${{ github.repository }}'
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
            # A draft left by a failed earlier run of a version release: publish it now.
            if ('${{ steps.version.outputs.tag-exists }}' -eq 'true') {
              gh release edit $env:TAG --draft=false --repo '${{ github.repository }}'
            }
          } else {
            gh release create $env:TAG $env:ZIP_NAME `
              --repo '${{ github.repository }}' `
              --title '${{ inputs.app-name }} ${{ steps.version.outputs.tag }}' `
              @notesArgs
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
