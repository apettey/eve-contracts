# Reusable Windows desktop build for .NET apps.
#
# Call this from any repo owned by apettey (eve-contracts, hangarscope, multi-box):
#
#   jobs:
#     build:
#       uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
#       with:
#         project: src/MyApp/MyApp.csproj
#         app-name: MyApp
#
# Produces a ready-to-run, self-contained win-x64 zip:
#  - every run: uploaded as a workflow artifact
#  - runs for a v* tag: attached to a GitHub Release for that tag
#  - runs with `release-tag` + `version` (release-on-merge callers): built as that version,
#    then the tag is created at the built commit and the Release published, only after the
#    artefact exists. Callers that pass neither input behave exactly as before.
name: Build Windows App

on:
  workflow_call:
    inputs:
      project:
        description: Path to the .csproj to publish
        required: true
        type: string
      app-name:
        description: Application name used for the zip / release asset
        required: true
        type: string
      dotnet-version:
        description: .NET SDK version
        required: false
        type: string
        default: 10.0.x
      runtime:
        description: Publish runtime identifier
        required: false
        type: string
        default: win-x64
      self-contained:
        description: Bundle the runtime so no .NET install is needed
        required: false
        type: boolean
        default: true
      test-project:
        description: Optional test project to run before publishing (empty = skip)
        required: false
        type: string
        default: ""
      publish-args:
        description: Extra arguments appended to dotnet publish
        required: false
        type: string
        default: ""
      main-exe:
        description: >-
          Main executable name (e.g. MyApp.exe). When set, a Velopack installer
          (Setup.exe + delta update packages) is built and, on tag builds,
          published to the GitHub Release so installed apps auto-update.
        required: false
        type: string
        default: ""
      pack-id:
        description: Velopack package id (defaults to app-name)
        required: false
        type: string
        default: ""
      version:
        description: >-
          X.Y.Z to build. Only used together with release-tag; tag-ref and branch builds
          keep deriving it from the ref.
        required: false
        type: string
        default: ""
      release-tag:
        description: >-
          Release as this tag (e.g. v1.2.3) from a non-tag ref. The tag is created at the
          built commit after packing (reused if it already points there) and the Release is
          published to it. Empty = old behaviour (release only when the ref is a v* tag).
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # release upload on tag builds
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Compute version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          $tag = '${{ github.ref_name }}'
          if ($env:INPUT_TAG) {
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:INPUT_TAG -ne "v$env:INPUT_VERSION") {
              throw "release-tag '$env:INPUT_TAG' needs version X.Y.Z with tag vX.Y.Z (got '$env:INPUT_VERSION')"
            }
            $version = $env:INPUT_VERSION
            $release = 'true'
            $tag = $env:INPUT_TAG
          } elseif ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(?<v>\d+\.\d+\.\d+.*)$') {
            $version = $Matches.v
            $release = 'true'
          } else {
            # Velopack requires package versions >= 0.0.1
            $version = "0.0.1-ci.${{ github.run_number }}"
            $release = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (release: $release, tag: $tag)"

      - name: Test
        if: inputs.test-project != ''
        run: dotnet test "${{ inputs.test-project }}" -c Release --nologo

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish "${{ inputs.project }}" `
            -c Release `
            -r ${{ inputs.runtime }} `
            --self-contained ${{ inputs.self-contained }} `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish `
            ${{ inputs.publish-args }}

      - name: Zip
        shell: pwsh
        run: |
          $zip = "${{ inputs.app-name }}-${{ steps.version.outputs.version }}-${{ inputs.runtime }}.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # A storage-quota blip must never fail the build or block a release publish;
        # the zip is a convenience download, not a release gate.
        continue-on-error: true
        with:
          name: ${{ inputs.app-name }}-${{ steps.version.outputs.version }}-${{ inputs.runtime }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      # ---- Velopack installer + auto-update packages ----
      - name: Velopack pack
        if: inputs.main-exe != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk
          $packId = '${{ inputs.pack-id }}'
          if (-not $packId) { $packId = '${{ inputs.app-name }}' }
          # Previous releases enable delta packages; fails harmlessly before the first release.
          # Tag builds only: CI builds are versioned 0.0.1-ci.N, which sorts below any
          # published release, and vpk pack refuses to package a version lower than one
          # already in the Releases folder. Deltas only matter for what the updater serves.
          if ('${{ steps.version.outputs.release }}' -eq 'true') {
            vpk download github --repoUrl 'https://github.com/${{ github.repository }}' --token $env:GH_TOKEN
            if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release found - building full package only.' }
          }
          vpk pack --packId $packId `
            --packVersion '${{ steps.version.outputs.version }}' `
            --packDir publish `
            --mainExe '${{ inputs.main-exe }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Only real releases keep an installer artifact; CI builds skip it to stay
      # well under the Actions storage quota (the installer is ~3x the app zip).
      - name: Upload installer artifact
        if: inputs.main-exe != '' && steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ inputs.app-name }}-${{ steps.version.outputs.version }}-installer
          path: Releases/
          retention-days: 7

      # release-tag mode only: the artefact now exists, so create the tag at the built commit.
      # Creating it explicitly (instead of letting the Release create it) pins it to github.sha
      # even if main has moved on. An existing tag is reused only if it points at this commit.
      - name: Create tag (release-tag builds)
        if: inputs.release-tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existing = gh api "repos/${{ github.repository }}/git/ref/tags/$env:TAG" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            # annotated tags point at a tag object; peel to the commit
            $commit = gh api "repos/${{ github.repository }}/commits/$env:TAG" --jq '.sha'
            if ($commit -ne '${{ github.sha }}') { throw "$env:TAG already exists at $commit, not ${{ github.sha }}" }
            Write-Host "$env:TAG already points at ${{ github.sha }}; reusing it"
          } else {
            gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/$env:TAG" -f 'sha=${{ github.sha }}' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "could not create $env:TAG" }
            Write-Host "Created $env:TAG at ${{ github.sha }}"
          }

      - name: Publish Velopack packages to release (tag builds)
        if: inputs.main-exe != '' && steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A re-run of a release-tag build whose packages were already published must not
          # publish again: installed copies may already be on it.
          if ('${{ inputs.release-tag }}') {
            $assets = gh release view $env:TAG --repo '${{ github.repository }}' --json assets --jq '.assets[].name' 2>$null
            if ($LASTEXITCODE -eq 0 -and ($assets | Where-Object { $_ -like '*-full.nupkg' })) {
              Write-Host "$env:TAG already has Velopack packages; not uploading again"
              exit 0
            }
          }
          vpk upload github --repoUrl 'https://github.com/${{ github.repository }}' `
            --token $env:GH_TOKEN `
            --publish `
            --releaseName "${{ inputs.app-name }} $env:TAG" `
            --tag $env:TAG
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Release (tag builds)
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP_NAME --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $env:TAG $env:ZIP_NAME `
              --repo '${{ github.repository }}' `
              --title "${{ inputs.app-name }} $env:TAG" `
              --verify-tag `
              --generate-notes
          }
