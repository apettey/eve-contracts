# Every merge to main is a release (see .claude/skills/ship-change/references/versioning-and-release.md).
#
#   version  → the shared next-version action (.github/actions/next-version, the same code
#              hangarscope and multi-box use) decides vX.Y.Z from the merged PR (label, else a
#              new whats-new/features.json entry = minor, else patch) and writes the notes
#   build    → reusable build: test, publish, Velopack pack, THEN create the tag at this commit and
#              publish the Release (installed copies auto-update from it, so this is the deploy).
#              deploy:manual publishes a prerelease, which installed copies ignore until promoted.
#   finalize → the shared finalize-release action sets the Release body and checks the Release
#              has the Velopack packages and the zip
#
# One run at a time, in merge order. GitHub keeps only the newest pending run per concurrency
# group, so if merges outpace builds a pending run can be dropped; the next run then releases
# everything since the last published tag in one version (biggest bump wins). Nothing is ever
# skipped. Re-running a run whose commit is already tagged reuses that tag; once its Release is
# published, a re-run only re-applies the notes.
name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      bump:
        description: "auto = from labels/announcements; or force a bump (backlog recovery)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # A dispatch from another branch would tag and auto-update a commit that isn't on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # PR labels/title for the merged commits; a failed lookup fails the run
    outputs:
      release: ${{ steps.next.outputs.release }}
      finalize: ${{ steps.next.outputs.finalize }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      prerelease: ${{ steps.next.outputs.prerelease }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags: the version is computed from the newest published vX.Y.Z

      # This repo's own copy (same commit), so changes to it ship in lockstep. The other repos
      # call apettey/eve-contracts/.github/actions/next-version@main.
      - name: Compute version
        id: next
        uses: ./.github/actions/next-version
        with:
          bump: ${{ inputs.bump || 'auto' }}
          app-name: ContractTracker

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    # Same commit's copy of the reusable workflow, so changes to it ship in lockstep.
    uses: ./.github/workflows/build-windows-app.yml
    permissions:
      contents: write # tag + Release
    with:
      project: src/EveContracts.App/EveContracts.App.csproj
      app-name: ContractTracker
      test-project: tests/EveContracts.Tests/EveContracts.Tests.csproj
      main-exe: EveContracts.App.exe
      version: ${{ needs.version.outputs.version }}
      release-tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  # Also runs when the build was skipped because the Release is already published (a re-run),
  # so the notes are never silently left out.
  finalize:
    needs: [version, build]
    if: >-
      always() && needs.version.outputs.finalize == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release edit
    steps:
      - uses: actions/checkout@v7 # the local action below lives in the repo

      - name: Release notes and state
        uses: ./.github/actions/finalize-release
        with:
          tag: ${{ needs.version.outputs.tag }}
          notes: ${{ needs.version.outputs.notes }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          build-result: ${{ needs.build.result }}
          app-name: ContractTracker
