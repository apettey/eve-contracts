# Builds the Contract Tracker Windows app via the reusable workflow.
# - every branch push / manual run: CI build, downloadable from the run's Artifacts
# - push a tag like v1.0.0: same build, attached to a GitHub Release
name: Release

on:
  push:
    # Build every human branch, but not Dependabot's — those are covered by the
    # lighter CI workflow on the PR, so we don't waste a full Velopack build per bump.
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: src/EveContracts.App/EveContracts.App.csproj
      app-name: ContractTracker
      test-project: tests/EveContracts.Tests/EveContracts.Tests.csproj
      main-exe: EveContracts.App.exe
