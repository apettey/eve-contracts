# Release checks for pull requests: the version this PR would release, the announcement file,
# the PR's release-log entry, a lint of the workflows and the shared versioning scripts' own
# tests (scripts/versioning: the code behind .github/actions/, which hangarscope and multi-box
# also call).
# Linux-only and separate from ci.yml, so a label change (which can change the version) re-runs
# this in seconds without cancelling the Windows build. Every check step runs even when an
# earlier one failed (!cancelled()), so one failure doesn't hide the others or the preview.
name: PR checks

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the version preview looks up unreleased merges' labels; fails closed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags (latest vX.Y.Z) and the base commit

      - name: Versioning script tests
        run: python3 -m unittest discover -s scripts/versioning -v

      # Pinned version, checksum-verified. Bump both together (sha256 from the release's checksums.txt).
      - name: Lint workflows (actionlint)
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Every PR adds changelog/YYYY-MM-DD-<name>/README.md; Dependabot PRs are exempt.
      # HEAD is the PR merged into its base, so HEAD^1..HEAD is what the squash commit adds.
      - name: Release-log entry
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/versioning/check_changelog.py --base HEAD^1 --head HEAD --author "$AUTHOR"

      # The shared validator (.github/actions/validate-features, also used by hangarscope and
      # multi-box). HEAD is the PR merged into its base, so HEAD^1 is the base: entries added
      # since it must carry this PR's number.
      - name: Validate whats-new/features.json
        if: ${{ !cancelled() }}
        uses: ./.github/actions/validate-features
        with:
          base: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          pr: ${{ github.event.pull_request.number }}

      # The shared next-version action in PR mode (the same code as the release run). The
      # checkout is the PR merged into its base, so HEAD^1 is the base and HEAD^1..HEAD is
      # exactly what the squash commit will contain.
      - name: Version preview
        id: preview
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/next-version
        with:
          mode: pr
          base: HEAD^1
          head: HEAD
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      - name: Release preview notice
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          TEXT: ${{ steps.preview.outputs.preview }}
        run: echo "::notice title=Release preview::${TEXT//\*\*/}"
