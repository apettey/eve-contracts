# Release checks for pull requests: the version this PR would release, the announcement file,
# the PR's release-log entry, a lint of the workflows and the versioning scripts' own tests.
# Linux-only and separate from ci.yml, so a label change (which can change the version) re-runs
# this in seconds without cancelling the Windows build. Every check step runs even when an
# earlier one failed (!cancelled()), so one failure doesn't hide the others or the preview.
name: PR checks

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags (latest vX.Y.Z) and the base commit

      - name: Versioning script tests
        run: python3 -m unittest discover -s scripts/versioning -v

      # Pinned version, checksum-verified. Bump both together (sha256 from the release's checksums.txt).
      - name: Lint workflows (actionlint)
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Every PR adds changelog/YYYY-MM-DD-<name>/README.md; Dependabot PRs are exempt.
      # HEAD is the PR merged into its base, so HEAD^1..HEAD is what the squash commit adds.
      - name: Release-log entry
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/versioning/check_changelog.py --base HEAD^1 --head HEAD --author "$AUTHOR"

      - name: Validate whats-new/features.json
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          # HEAD is the PR merged into its base, so HEAD^1 is the base (see Version preview)
          git show "HEAD^1:whats-new/features.json" > base-features.json 2>/dev/null || : > base-features.json
          python3 scripts/versioning/validate_features.py whats-new/features.json \
            --base-file base-features.json --pr "$PR"

      - name: Validate whats-new/features.json
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: python3 scripts/versioning/validate_features.py whats-new/features.json

      # The checkout is the PR merged into its base, so HEAD^1 is the base and HEAD^1..HEAD is
      # exactly what the squash commit will contain.
      - name: Version preview
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }} # read Releases: only published tags count, as in release.yml
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 scripts/versioning/bump.py pr --base HEAD^1 --head HEAD --labels "$LABELS" \
            --repo "$GITHUB_REPOSITORY" > preview.txt
          cat preview.txt
          version=$(sed -n 's/^version=//p' preview.txt)
          bump=$(sed -n 's/^bump=//p' preview.txt)
          reason=$(sed -n 's/^reason=//p' preview.txt)
          latest=$(sed -n 's/^latest=//p' preview.txt)
          {
            echo "### Merging this PR would release v$version"
            echo
            echo "**$bump** bump from ${latest:-no release yet}: $reason."
            echo
            echo "_If another PR merges first, the number moves up. Change it with a \`semver:major|minor|patch\` label._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release preview::Merging this PR would release v$version ($bump: $reason)"
